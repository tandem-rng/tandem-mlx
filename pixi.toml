[workspace]
name = "tandem-mlx"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = "3.14.*"
numpy = ">=2.0"
pytest = "*"
pip = "*"

# The editable install picks up source changes without a rebuild.
[pypi-dependencies]
tandem-mlx = { path = ".", editable = true }
mlx = ">=0.32.3, <0.33"

[tasks]
test = "pytest"

# The MLX wheels start at macOS 14. 15 matches the CI runner.
[system-requirements]
macos = "15.0"

# `pixi run -e cross test` adds the tandem-numpy cross-check, built from source.
[feature.cross.dependencies]
cython = ">=3.1"
meson-python = ">=0.18"
meson = ">=1.3"
ninja = "*"
pkg-config = "*"
c-compiler = "*"

[feature.cross.pypi-dependencies]
tandem-rng = { git = "https://github.com/tandem-rng/tandem-numpy", rev = "420f6cc1a3eec3faffb4a0075a77595093ed05e3" }

[feature.cross.pypi-options]
no-build-isolation = ["tandem-rng"]

# `pixi run bench` times MPSMatrixRandomPhilox as the baseline, through PyObjC.
[feature.bench.pypi-dependencies]
pyobjc-framework-MetalPerformanceShaders = ">=12.2"

[feature.bench.tasks]
bench = "python tools/bench.py"

[environments]
cross = ["cross"]
bench = ["bench"]
