[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem-mlx"
version = "0.1.0"
description = "Tandem8x32 for MLX: a pseudorandom number generator fast on CPUs and GPUs alike"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jessica Cox"}]
requires-python = ">=3.13"
dependencies = ["mlx>=0.32", "numpy>=2.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Specification = "https://github.com/tandem-rng/spec"
Source = "https://github.com/tandem-rng/tandem-mlx"

[tool.setuptools.package-data]
tandem_mlx = ["*.metal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
