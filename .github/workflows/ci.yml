name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: "3.13"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # tandem-numpy builds from source for the cross-check, with its tandem-c submodule.
      - run: pip install . pytest "tandem-rng @ git+https://github.com/tandem-rng/tandem-numpy@420f6cc1a3eec3faffb4a0075a77595093ed05e3"
      - run: python -c "import mlx.core as mx; print(mx.__version__, mx.device_info())"
      - run: pytest -rs
  vectors:
    name: vectors are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git clone --depth 1 https://github.com/tandem-rng/spec ../spec
      - run: diff ../spec/vectors.json tests/vectors.json
